name: Bug report
description: Report a reproducible component, theme, documentation or integration problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: bootstrapcn version
      placeholder: "0.3.0"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include minimal HTML and numbered steps, or a public reproduction link. Remove private data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, OS, viewport, palette and color mode
      placeholder: "Chrome 153, Windows 11, 390px, violet/dark"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or console output
      description: Optional. Remove secrets before posting.
